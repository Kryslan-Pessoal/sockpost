name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # macos-latest runners are arm64 and there is no arm64 build of
          # CPython 3.9; that leg runs on the last Intel image instead.
          - os: macos-latest
            python-version: "3.9"
        include:
          - os: macos-13
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and end to end tests
        run: python -m pytest
      - name: Smoke test
        run: tools/smoke.sh

  gate:
    name: publication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak check
        run: tools/leak-check.sh
